<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QX Packet Unpacker Web</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">GitHub Pages Ready</p>
          <h1>QX Packet Unpacker</h1>
        </div>
        <span class="repo-link">本机处理</span>
      </header>

      <section id="dropZone" class="drop-zone">
        <div class="drop-copy">
          <strong>选择 qx 抓包导出目录</strong>
          <span>所有解包都在你的浏览器本机完成，文件不会上传到服务器。</span>
        </div>
        <button id="chooseButton">选择目录</button>
        <input
          id="fileInput"
          type="file"
          webkitdirectory
          directory
          multiple
          hidden
        />
      </section>

      <section class="panel">
        <div class="field">
          <label for="sourcePath">源目录</label>
          <input id="sourcePath" readonly placeholder="还没有选择目录" />
        </div>
        <div class="actions">
          <button id="convertButton" disabled>解包并生成 TXT</button>
          <button id="downloadButton" class="secondary" disabled>下载 TXT</button>
          <button id="clearButton" class="ghost">清空</button>
        </div>
      </section>

      <section class="stats" aria-live="polite">
        <div>
          <span id="requestCount">0</span>
          <small>请求</small>
        </div>
        <div>
          <span id="decodedCount">0</span>
          <small>已解压响应</small>
        </div>
        <div>
          <span id="jsonCount">0</span>
          <small>JSON</small>
        </div>
        <div>
          <span id="binaryCount">0</span>
          <small>二进制</small>
        </div>
      </section>

      <section class="preview-wrap">
        <div class="preview-head">
          <h2>预览</h2>
          <span id="statusText">等待选择目录</span>
        </div>
        <pre id="preview">选择 qx 抓包目录后，生成的 txt 预览会显示在这里。</pre>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
