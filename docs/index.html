<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QX Packet Unpacker Web</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">GitHub Pages Ready</p>
          <h1>QX Packet Unpacker</h1>
        </div>
        <span class="repo-link">本机处理</span>
      </header>

      <section id="dropZone" class="drop-zone">
        <div class="drop-copy">
          <strong>选择 qx 抓包导出目录</strong>
          <span>所有解包都在你的浏览器本机完成，文件不会上传到服务器。</span>
        </div>
        <button id="chooseButton">选择目录</button>
        <input
          id="fileInput"
          type="file"
          webkitdirectory
          directory
          multiple
          hidden
        />
      </section>

      <section class="panel">
        <div class="field">
          <label for="sourcePath">源目录</label>
          <input id="sourcePath" readonly placeholder="还没有选择目录" />
        </div>
        <div class="actions">
          <button id="convertButton" disabled>解析并查看</button>
          <button id="downloadButton" class="secondary" disabled>下载 TXT</button>
          <button id="clearButton" class="ghost">清空</button>
        </div>
      </section>

      <section class="stats" aria-live="polite">
        <div>
          <span id="requestCount">0</span>
          <small>请求</small>
        </div>
        <div>
          <span id="decodedCount">0</span>
          <small>已解压响应</small>
        </div>
        <div>
          <span id="jsonCount">0</span>
          <small>JSON</small>
        </div>
        <div>
          <span id="binaryCount">0</span>
          <small>二进制</small>
        </div>
      </section>

      <section class="viewer">
        <aside class="request-list">
          <div class="preview-head">
            <h2>请求列表</h2>
            <span id="listCount">0 条</span>
          </div>
          <div class="search-row">
            <input id="searchInput" placeholder="搜索 URL、方法、状态码" />
          </div>
          <div id="filterBar" class="filter-bar" aria-label="请求筛选标签">
            <button class="filter-chip active" data-filter="all">all</button>
            <button class="filter-chip" data-filter="json">json</button>
            <button class="filter-chip" data-filter="get">get</button>
            <button class="filter-chip" data-filter="post">post</button>
            <button class="filter-chip" data-filter="image">image</button>
            <button class="filter-chip" data-filter="200">200</button>
            <button class="filter-chip" data-filter="script">script</button>
            <button class="filter-chip" data-filter="mitm">mitm</button>
            <button class="filter-chip" data-filter="rewrite">rewrite</button>
          </div>
          <div id="requestList" class="request-items">
            <div class="empty-state">解析后会显示每一条抓包。</div>
          </div>
        </aside>

        <section class="detail-pane">
          <div class="preview-head detail-head">
            <div>
              <h2 id="detailTitle">详情</h2>
              <p id="detailSubtitle">选择一条请求查看内容</p>
            </div>
            <span id="statusText">等待选择目录</span>
          </div>
          <div class="tabs" role="tablist" aria-label="抓包详情">
            <button class="tab active" data-tab="summary">概要</button>
            <button class="tab" data-tab="requestHeaders">请求头</button>
            <button class="tab" data-tab="requestBody">请求体</button>
            <button class="tab" data-tab="responseHeaders">响应头</button>
            <button class="tab" data-tab="responseBody">响应体</button>
          </div>
          <div id="detailContent" class="detail-content">
            <div class="empty-state">选择 qx 抓包目录并解析后，可以在这里逐条预览。</div>
          </div>
        </section>
      </section>

      <section class="preview-wrap compact">
        <div class="preview-head">
          <h2>TXT 输出预览</h2>
          <span id="txtStatusText">可选下载</span>
        </div>
        <pre id="preview">选择 qx 抓包目录后，生成的 txt 预览会显示在这里。</pre>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
