<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QX Packet Unpacker</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Quantumult X Capture</p>
          <h1>QX Packet Unpacker</h1>
        </div>
        <button id="pickButton" class="icon-button" title="选择目录" aria-label="选择目录">
          <span>📂</span>
        </button>
      </header>

      <section id="dropZone" class="drop-zone">
        <div class="drop-copy">
          <strong>拖入 qx 抓包导出目录</strong>
          <span>支持包含 1/basic、1/request_headers、1/response_body 这类结构的文件夹</span>
        </div>
        <button id="chooseButton">选择目录</button>
      </section>

      <section class="panel">
        <div class="field">
          <label for="sourcePath">源目录</label>
          <input id="sourcePath" readonly placeholder="还没有选择目录" />
        </div>
        <div class="actions">
          <button id="convertButton" disabled>解包并生成 TXT</button>
          <button id="openButton" class="secondary" disabled>打开结果</button>
        </div>
      </section>

      <section class="stats" aria-live="polite">
        <div>
          <span id="requestCount">0</span>
          <small>请求</small>
        </div>
        <div>
          <span id="decodedCount">0</span>
          <small>已解压响应</small>
        </div>
        <div>
          <span id="jsonCount">0</span>
          <small>JSON</small>
        </div>
        <div>
          <span id="binaryCount">0</span>
          <small>二进制</small>
        </div>
      </section>

      <section class="preview-wrap">
        <div class="preview-head">
          <h2>预览</h2>
          <span id="statusText">等待选择目录</span>
        </div>
        <pre id="preview">生成后会在这里显示 txt 前几段内容。</pre>
      </section>
    </main>

    <script src="./renderer.js"></script>
  </body>
</html>
